name: Verificar compilacao BigLogno

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Compilacao Vite / Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Configurar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - name: Instalar dependencias como no Cloudflare
        run: bun install
      - name: Testar animacao e KM por trecho
        run: bun test src/lib/delivery-route-animation.test.js
      - name: Testar agrupamento das entregas pendentes
        run: bun test src/lib/manager-delivery-rows.test.js
      - name: Testar indicadores gerenciais sem duplicar notas
        run: bun test src/lib/manager-delivery-time-totals.test.js
      - name: Testar números da apresentação do gestor
        run: bun test src/lib/manager-welcome-data.test.js
      - name: Testar novos filtros Ontem e Anteontem na Conferência
        run: bun test src/lib/sales-conference-period.test.js
      - name: Testar mudança automática de turnos
        run: bun test src/lib/expedition-schedule.test.js
      - name: Testar ciclos e regras da Logística Reversa
        run: bun test src/lib/reverse-logistics.test.js
      - name: Testar cadastro de fornecedor e orientador de tratativas
        run: bun test src/lib/reverse-guide.test.js
      - name: Testar indicadores e filtros da nova Logistica Reversa
        run: bun test src/lib/reverse-logistics-view.test.js
      - name: Testar etiquetas de volumes Argox
        run: bun test src/lib/reverse-volume-labels.test.js
      - name: Testar arquivos separados da Contagem
        run: bun test src/lib/counting-downloads.test.js
      - name: Testar coletor mobile, código de barras, modo restrito e PDF
        run: bun test src/lib/counting-collector.test.js
      - name: Testar histórico Coletados da Expedição
        run: bun test src/lib/expedition-history.test.js
      - name: Testar N/D, Manhã e Tarde nas Retiras da Expedição
        run: bun test src/lib/pickups.test.js
      - name: Testar elegibilidade e filtros de etiquetas Entrega ou Retira
        run: bun test src/lib/conference-label-selection.test.js
      - name: Testar marcacao verde e filtros de etiquetas geradas ou pendentes
        run: bun test src/lib/conference-label-print-state.test.js
      - name: Testar PDFs individuais e multipaginas Argox 60x30mm
        run: bun test src/lib/conference-label.test.js
      - name: Testar ativacao segura e elegibilidade da impressao automatica
        run: bun test src/lib/auto-conference-print.test.js
      - name: Testar busca de itens, unidades e etiquetas S.B.O da Argox
        run: bun test src/lib/sbo-label.test.js
      - name: Validar mascote animado e mensagem do carregamento
        run: bun test src/lib/loading-mascot.test.js
      - name: Testar fila simplificada, unificação explícita, veículos e turnos automáticos
        run: bun test src/lib/deliveries.test.js src/lib/delivery-dispatch.test.js src/lib/delivery-grouping.test.js src/lib/expedition-schedule.test.js
      - name: Executar build de producao
        run: npm run build
